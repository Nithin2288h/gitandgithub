<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .login-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 380px;
      }

      h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #333;
      }

      .input-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d5d5d5;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      }

      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0 20px;
        font-size: 14px;
        color: #555;
      }

      .options a {
        color: #667eea;
        text-decoration: none;
      }

      .login-btn {
        width: 100%;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .login-btn:hover {
        background: #5a6fe1;
      }

      .signup {
        text-align: center;
        margin-top: 18px;
        color: #555;
        font-size: 14px;
      }

      .signup a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Login</h2>
      <form>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <div class="options">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="signup">
          Don't have an account? <a href="#">Sign up</a>
        </div>
      </form>
    </div>
  </body>
</html>
